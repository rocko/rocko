name: GitHub Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT used to collect account-wide GitHub statistics.
          token: ${{ secrets.METRICS_TOKEN }}
          user: rocko

          # Repository-scoped token used only to commit the generated SVG.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update GitHub metrics [skip ci]"

          filename: github-metrics.svg

          base: header, activity, repositories

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          config_timezone: Europe/Berlin
          config_order: base.header, languages, isocalendar, base.activity, base.repositories
